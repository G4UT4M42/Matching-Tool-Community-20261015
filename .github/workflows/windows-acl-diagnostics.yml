name: Isolated Windows ACL startup diagnostic
on:
  push:
    branches: [ci/windows-acl-diagnostics-20261015]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Discover bounded ordinary Windows environment and strict ACL behavior
        shell: pwsh
        run: node scripts/diagnose-windows-acl.mjs "$env:RUNNER_TEMP/windows-acl-diagnostics.json"
      - name: Preserve bounded diagnostic JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-acl-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/windows-acl-diagnostics.json
          if-no-files-found: error
          retention-days: 7
