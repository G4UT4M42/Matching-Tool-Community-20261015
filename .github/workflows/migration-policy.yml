name: Community verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy-and-build:
    name: Windows privacy, migration, build and acceptance
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure isolated synthetic evidence directories
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'community-evidence'
          "MATCHING_TEST_EVIDENCE_ROOT=$evidence" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "MATCHING_MAIN_BROWSER_EVIDENCE_DIR=$(Join-Path $evidence 'browser')" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "MATCHING_PACKAGING_EVIDENCE=$(Join-Path $evidence 'packaging')" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "MATCHING_COMPONENT_BROWSER_EVIDENCE_ROOT=$(Join-Path $env:RUNNER_TEMP 'community-component-evidence')" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream ref
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Install audited sources without arbitrary post-install scripts
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm rebuild better-sqlite3 sharp esbuild
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix web --ignore-scripts
      - name: Check private data and prohibited artifacts
        run: node scripts/check-public-tree.mjs --index-all
      - name: Require migration evidence for persistence changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-pr.mjs --base origin/main
      - name: Backend and frontend build
        run: npm run build
      - name: Synthetic capacity, exact persistence and bounded memory
        run: node --import tsx scripts/qualify-community-capacity.mjs --out "${{ runner.temp }}/community-evidence/capacity"
      - name: Complete application and migration tests
        run: node scripts/run-community-tests.mjs app
      - name: Actual built browser, Windows installation and policy tests
        run: node scripts/run-community-tests.mjs node
      - name: Deterministic license inventory and SBOM
        run: |
          node scripts/create-compliance-inventory.mjs --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/create-compliance-inventory.mjs --out "${{ runner.temp }}/community-compliance"
      - name: No production-level critical or high npm advisories
        run: npm audit --omit=dev --audit-level=high
      - name: No unlicensed banking XSD bundles
        run: |
          $files = Get-ChildItem -LiteralPath src/payments/xsd -Filter *.xsd -File -ErrorAction SilentlyContinue
          if ($files) { throw 'Unreviewed banking XSD must not enter source' }
      - name: Preserve exact-commit synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: community-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/community-evidence
            ${{ runner.temp }}/community-component-evidence/*/*.png
            ${{ runner.temp }}/community-component-evidence/*/*result.json
            ${{ runner.temp }}/community-component-evidence/*/failure.json
          if-no-files-found: warn
